workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.go:
  image: golang:1.27
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build

check:
  extends: .go
  variables:
    NODE_VERSION: "22.22.1"
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
    pnpm_config_store_dir: $CI_PROJECT_DIR/.cache/pnpm-store
  cache:
    key:
      files: [go.sum, web/pnpm-lock.yaml]
    paths: [.cache/]
  before_script:
    - curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/').tar.gz" | tar -xz -C /usr/local --strip-components=1
    - npm i -g "$(node -p "require('./web/package.json').packageManager")"
  script:
    - make check

e2e:
  # Ubuntu with Node and Chromium for Playwright (amd64 and arm64); Go is added below.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  variables:
    GO_VERSION: "1.27.3"
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
    pnpm_config_store_dir: $CI_PROJECT_DIR/.cache/pnpm-store
  cache:
    key:
      prefix: e2e
      files: [go.sum, e2e/ui/pnpm-lock.yaml]
    paths: [.cache/]
  before_script:
    - curl -fsSL "https://dl.google.com/go/go$GO_VERSION.linux-$(dpkg --print-architecture).tar.gz" | tar -xz -C /usr/local
    - export PATH="/usr/local/go/bin:$PATH"
    - npm i -g "$(node -p "require('./e2e/ui/package.json').packageManager")"
  script:
    - make e2e

test-guard:
  image: golang:1.27
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # Run the target's copy so an MR cannot loosen the guard it is checked by.
    - |
      if git cat-file -e FETCH_HEAD:scripts/check-tests 2>/dev/null; then
        git show FETCH_HEAD:scripts/check-tests >/tmp/check-tests
        sh /tmp/check-tests FETCH_HEAD
      else
        echo "test-guard: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME has no scripts/check-tests yet, nothing to enforce"
      fi
