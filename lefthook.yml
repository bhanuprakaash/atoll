pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: |
        files=$(gofmt -l {staged_files})
        [ -z "$files" ] || { echo "not gofmt-ed: $files"; exit 1; }
    - name: prettier
      root: web/
      glob: "*.{ts,js,json,css,html}"
      run: npx prettier --check {staged_files}
