name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - run: npm i -g "$(node -p "require('./web/package.json').packageManager")"
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: make check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Ubuntu with Node and Chromium for Playwright; Go is added below.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      GO_VERSION: "1.27.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The container user does not own the checkout, so git refuses it and Go's VCS stamping fails.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: docs-only
        if: github.event_name == 'pull_request'
        shell: sh
        run: |
          git rev-parse --verify "origin/$GITHUB_BASE_REF" >/dev/null
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | while IFS= read -r path; do
            case "$path" in
              docs/*|*.md|.claude/*) ;;
              *) exit 1 ;;
            esac
          done; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: apt-get update -qq && apt-get install -y -qq make dbus gnome-keyring libsecret-tools >/dev/null
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: curl -fsSL "https://dl.google.com/go/go$GO_VERSION.linux-$(dpkg --print-architecture).tar.gz" | tar -xz -C /usr/local
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: echo /usr/local/go/bin >> "$GITHUB_PATH"
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: npm i -g "$(node -p "require('./e2e/ui/package.json').packageManager")"
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: make e2e-go

  e2e-ui:
    name: e2e-ui
    runs-on: ubuntu-latest
    # Ubuntu with Node and Chromium for Playwright; Go is added below.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      GO_VERSION: "1.27.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The container user does not own the checkout, so git refuses it and Go's VCS stamping fails.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: docs-only
        if: github.event_name == 'pull_request'
        shell: sh
        run: |
          git rev-parse --verify "origin/$GITHUB_BASE_REF" >/dev/null
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | while IFS= read -r path; do
            case "$path" in
              docs/*|*.md|.claude/*) ;;
              *) exit 1 ;;
            esac
          done; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: apt-get update -qq && apt-get install -y -qq make dbus gnome-keyring libsecret-tools >/dev/null
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: curl -fsSL "https://dl.google.com/go/go$GO_VERSION.linux-$(dpkg --print-architecture).tar.gz" | tar -xz -C /usr/local
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: echo /usr/local/go/bin >> "$GITHUB_PATH"
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: npm i -g "$(node -p "require('./e2e/ui/package.json').packageManager")"
      - if: steps.docs-only.outputs.docs_only != 'true'
        run: make e2e-ui

  test-guard:
    name: test-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the base branch's guard
        # The base's copy, so a PR cannot loosen the guard it is checked by.
        run: |
          git fetch -q origin "$GITHUB_BASE_REF"
          if git cat-file -e "origin/$GITHUB_BASE_REF:scripts/check-tests" 2>/dev/null; then
            guard=$(mktemp)
            git show "origin/$GITHUB_BASE_REF:scripts/check-tests" >"$guard"
            sh "$guard" "origin/$GITHUB_BASE_REF"
          else
            echo "test-guard: $GITHUB_BASE_REF has no scripts/check-tests yet, nothing to enforce"
          fi

  dmg:
    name: dmg
    if: github.event_name == 'push'
    runs-on: macos-latest
    # The app is ad-hoc signed, not notarized, so first open needs System Settings → Open Anyway.
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - run: npm i -g "$(node -p "require('./web/package.json').packageManager")"
      - run: rustup toolchain install stable --profile minimal
      - if: github.ref_type != 'tag'
        run: make app
      # A v* tag publishes the release the app's updater reads; the version comes from the tag.
      - if: github.ref_type == 'tag'
        run: scripts/release "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: Reef
          path: desktop/src-tauri/target/release/bundle/dmg/

  linux:
    name: linux
    # After dmg so that on a v* tag the release exists; dmg is skipped on pull requests.
    needs: dmg
    if: ${{ !cancelled() && (needs.dmg.result == 'success' || needs.dmg.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential file patchelf xdg-utils libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - run: npm i -g "$(node -p "require('./web/package.json').packageManager")"
      - run: rustup toolchain install stable --profile minimal
      - if: github.ref_type != 'tag'
        run: make app
      # A v* tag adds the AppImage to the release the dmg job created.
      # Only this step gets the signing key: the job also runs on pull requests.
      - if: github.ref_type == 'tag'
        run: scripts/release "${GITHUB_REF_NAME#v}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: Reef-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
